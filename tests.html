<!doctype html><meta charset="utf-8"><title>TaskFlow tests</title><style>body{font:15px system-ui;max-width:900px;margin:3rem auto;padding:0 1rem}li.pass{color:#087a4b}li.fail{color:#b42318}code{background:#eee;padding:.15rem .3rem}</style><h1>TaskFlow pure-logic tests</h1><p id="summary">Running…</p><ol id="results"></ol><script type="module">
import { createInitialState, taskRecord, createId, nextRecurringDate, subtaskProgress, validateTask } from "./js/utils.js";
import { reducer } from "./js/reducer.js";
import { createStore, validateState } from "./js/store.js";
import { mergeStates, validateImportState } from "./js/importExport.js";
const list=document.querySelector('#results');let passed=0,failed=0;function test(name,fn){try{fn();passed++;list.insertAdjacentHTML('beforeend',`<li class="pass">✓ ${name}</li>`)}catch(e){failed++;const li=document.createElement('li');li.className='fail';li.textContent=`✗ ${name}: ${e.message}`;list.append(li)}}function ok(v,m='assertion failed'){if(!v)throw Error(m)}
function state(){return createInitialState()} function add(s,columnId=s.boardsById[s.activeBoardId].columnIds[0],title='Task'){const task=taskRecord({title},s.activeBoardId,columnId,createId('task'),'2026-01-01T00:00:00.000Z');return reducer(s,{type:'TASK_CREATE',payload:{task,now:'2026-01-01T00:00:00.000Z'}})}
test('reducer leaves its input immutable',()=>{const s=state(), before=JSON.stringify(s),n=add(s);ok(JSON.stringify(s)===before);ok(n!==s)});
test('task validation trims, limits titles, dates, and duplicate labels',()=>{ok(validateTask({title:'   '}).title);ok(validateTask({title:'x'.repeat(81)}).title);ok(validateTask({title:'ok',dueDate:'2026-02-30'}).dueDate);ok(validateTask({title:'ok',labels:[{name:'Bug'},{name:'bug'}]}).labels)});
test('move and reorder preserve invariants and position',()=>{let s=add(state()), a=Object.keys(s.tasksById)[0], b=taskRecord({title:'Second'},s.activeBoardId,s.boardsById[s.activeBoardId].columnIds[0]);s=reducer(s,{type:'TASK_CREATE',payload:{task:b}});const target=s.boardsById[s.activeBoardId].columnIds[1];s=reducer(s,{type:'TASK_MOVE',payload:{taskId:a,targetColumnId:target,targetIndex:0,now:'2026-01-02T00:00:00.000Z'}});validateState(s);ok(s.columnsById[target].taskIds[0]===a)});
test('WIP limit blocks a move without state change',()=>{let s=add(state()), ids=s.boardsById[s.activeBoardId].columnIds, target=ids[1];s=reducer(s,{type:'COLUMN_EDIT',payload:{columnId:target,title:'In Progress',wipLimit:0}});let threw=false;try{reducer(s,{type:'TASK_MOVE',payload:{taskId:Object.keys(s.tasksById)[0],targetColumnId:target}})}catch{threw=true}ok(threw)});
test('column deletion moves tasks in order',()=>{let s=add(state()),[source,target]=s.boardsById[s.activeBoardId].columnIds;s=reducer(s,{type:'COLUMN_DELETE',payload:{columnId:source,destinationColumnId:target}});ok(s.columnsById[target].taskIds.length===1);validateState(s)});
test('undo and redo move restore an exact position',()=>{let s=add(state()),store=createStore(reducer,s),id=Object.keys(s.tasksById)[0],target=s.boardsById[s.activeBoardId].columnIds[1];ok(store.dispatch({type:'TASK_MOVE',payload:{taskId:id,targetColumnId:target,targetIndex:0}}).ok);store.dispatch({type:'HISTORY_UNDO'});ok(store.getState().tasksById[id].columnId!==target);store.dispatch({type:'HISTORY_REDO'});ok(store.getState().tasksById[id].columnId===target)});
test('monthly recurrence clamps month end',()=>ok(nextRecurringDate('2025-01-31','monthly')==='2025-02-28'));
test('subtask progress uses completed count',()=>ok(subtaskProgress([{completed:true},{completed:false},{completed:true}])===2));
test('invariant validator rejects duplicate task membership',()=>{const s=add(state()),id=Object.keys(s.tasksById)[0],columns=s.boardsById[s.activeBoardId].columnIds;s.columnsById[columns[1]].taskIds.push(id);let bad=false;try{validateState(s)}catch{bad=true}ok(bad)});
test('import merge remaps colliding IDs and stays valid',()=>{const a=add(state()),b=structuredClone(a),merged=mergeStates(a,b);validateImportState(merged);ok(merged.boardOrder.length===2)});
document.querySelector('#summary').textContent=`${passed} passed, ${failed} failed`; if(failed)throw Error(`${failed} TaskFlow tests failed`);
</script>
